<div class='cam-section'>
  <div class='section-title'>Camera</div>
  <div class='section-note cam-restart-note'>Saving restarts recording.</div>
  <div class='camera-settings-go-here'></div>
</div>
<hr>
<div class='rec-section'>
  <div class='section-title'>Recording</div>
  <label class='switchrow'>
    <div class="switch">
      <input type="checkbox" class="switch-input dvr-switch" />
      <span class="switch-label"></span>
    </div>
    DVR
  </label>
  <div class='rec-fields'>
    <div class='textinputlabel'>Storage Directory</div>
    <input type='text' class='textinput storagedir' placeholder='Path to storage directory'>
    <div class='textinputlabel'>Frame Rate</div>
    <select class='textinput select-fps'>
      <option>30</option>
      <option>25</option>
      <option>20</option>
      <option>15</option>
      <option>10</option>
      <option>5</option>
    </select>
    <label class='switchrow'>
      <div class="switch">
        <input type="checkbox" class="switch-input motion-switch" />
        <span class="switch-label"></span>
      </div>
      Detect Motion
    </label>
    <div class='motion-settings'>
      <div class='longselect'>
        <div class='textinputlabel bottomspace'>Sensitivity <span class='sliderval rvs-sense-value'></span></div>
        <input class="plainslider rvs-sense" type="range"  min="0" max="11" value="0" tabindex="0">
      </div>
      <br>
      <div class='longselect'>
        <div class='textinputlabel bottomspace'>Noise Cancellation <span class='sliderval rvs-noise-value'></span></div>
        <input class="plainslider rvs-noise" type="range"  min="0" max="11" value="0" tabindex="0">
      </div>
    </div>
  </div>
</div>
<div class='dialog-footer'>
  <div class='save-error'></div>
  <div class='cs-foot-btns'>
    <button type='button' class='regularbutton cancel-camera-settings'>Cancel</button>
    <button type='button' class='coloredbutton save-camera-settings'>Save</button>
  </div>
</div>
