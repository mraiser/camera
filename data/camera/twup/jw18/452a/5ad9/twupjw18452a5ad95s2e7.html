<div class='live-wrap'>
  <video class='live-video' muted autoplay playsinline style='display:none;'></video>
  <img class='live-img'>
  <div class='live-connecting'>Connecting…</div>
  <div class='live-nocam'></div>
  <div class='live-img-ctrls'>
    <button type='button' class='dvr-settings-button' title='Settings' aria-label='Settings'><img src='../app/asset/app/icons/ui/dark/settings.svg' alt=''></button>
    <button type='button' class='fullscreen-button' title='Full screen' aria-label='Full screen'></button>
    <button type='button' class='fullscreen-exit-button' title='Exit full screen' aria-label='Exit full screen'></button>
  </div>
</div>
<div class='settings-popup camera-settings-popup'>
  <div class='dialog-header cs-head'>
    <div class='cs-head-left'>
      <div class='cs-title'>Camera settings</div>
      <div class='cs-sub'></div>
    </div>
    <button type='button' class='popupcard-close close-camera-settings' aria-label='Close'>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
  </div>
  <div class='settings-popup-inner padme'></div>
</div>
