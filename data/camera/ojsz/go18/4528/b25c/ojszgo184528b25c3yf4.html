<div id='dvr-ui'></div>
<div class='wrap dvr-wrap'>
  <div class='picture-wrap'>
    <div class='img-wrap'></div>
    <div class='video-wrap'><video class="video-wrap-video" controls="true" autoplay="true" allowfullscreen="true" width="100%" height="100%"></video></div>
    <div class="snap-wrap"><img class="snap-wrap-img"></div>
  </div>
  <div class='dvr-navbar hideme'>
    <div class='navbar navbar-dark'>
      <div class='navbar-tab selected tab-live' data-id='cam-live'>Live</div>
      <div class='navbar-tab tab-dvr' data-id='cam-dvr'>DVR</div>
      <div class='navbar-tab tab-events' data-id='cam-events'>Events</div>
    </div>
    <div class='tab-content cam-live selected'></div>
    <div class='tab-content cam-dvr'>
      <div class='tab-message dvr-message'></div>
      <div class='dvr-images'></div>
      <center class='dvr-controls'>
        <div class='rvctable dvr-pickers'>
          <span class='dvr-date-part'>
            <div class='dvryearselect timeselect'></div>
            <div class='dvrmonthselect timeselect'></div>
            <div class='dvrdateselect timeselect'></div>
          </span>
          <span class='dvr-time-part'>
            <div class='dvrhourselect timeselect'></div>:&nbsp;&nbsp;
            <div class='dvrminselect timeselect'></div>:&nbsp;&nbsp;
            <div class='dvrsecselect timeselect'></div>
          </span>
        </div>
        <div class='rvctable dvr-duration'>
          <div class='textinputlabel durationsliderlable'>Duration:
            <input type='text' class='durationslidervalue'>
          </div>
          <input class="plainslider durationslider" type="range" min="5" max="300" value="5" tabindex="0">
        </div>
        <div class='rvctable'>
          <button class="coloredbutton dvrplaybutton">
            <img src="../app/asset/app/icons/ui/dark/play.svg" class="mediumicon">
          </button>
          <button class="coloredbutton dvrdownloadbutton">
            <a class='download_selected' download><img src="../app/asset/app/icons/ui/dark/download.svg" class="mediumicon"></a>
          </button>            
        </div>
      </center>
    </div>
    <div class='tab-content cam-events'>
      <div class='tab-message events-message'></div>
      <div class='event-images'></div>
    </div>
  </div>
</div>
